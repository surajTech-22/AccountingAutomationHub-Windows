name: AAH Internal Client Branches Regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'AAH/Tests/AAH.ClientBranches.Tests/**'
      - 'AAH/src/AccountingAutomationHub.Desktop/Services/ClientBranchCatalog.cs'
      - 'AAH/src/AccountingAutomationHub.Desktop/Services/ClientBranchAutoImportLayout.cs'
      - 'AAH/src/AccountingAutomationHub.Desktop/Services/BackgroundAutomationService.cs'
      - 'AAH/src/AccountingAutomationHub.Desktop/ViewModels/ClientManagementViewModel.cs'
      - 'AAH/src/AccountingAutomationHub.Desktop/ViewModels/DashboardViewModel.cs'
      - 'AAH/src/AccountingAutomationHub.Desktop/Views/ClientManagementView.xaml'
      - 'AAH/src/AccountingAutomationHub.Desktop/Views/DashboardView.xaml'
      - '.github/workflows/aah-client-branches.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  branch-regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test production branch parser and editor/dashboard contract
        run: dotnet run --project AAH/Tests/AAH.ClientBranches.Tests/AAH.ClientBranches.Tests.csproj --configuration Release
