name: AAH Windows Compile (CL017 R14)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aah-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout private source bundle
        uses: actions/checkout@v4

      - name: Verify and extract SHA-pinned AAH source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = @(Get-ChildItem -LiteralPath 'source-bundle' -Filter 'part*.b64' -File | Sort-Object Name)
          if ($parts.Count -ne 18) { throw "AAH source incomplete: expected 18 parts, found $($parts.Count)" }
          $encoded = [System.Text.StringBuilder]::new()
          foreach ($part in $parts) {
            $data = [System.IO.File]::ReadAllText($part.FullName, [System.Text.Encoding]::ASCII).Trim()
            if ($data -notmatch '^[A-Za-z0-9+/=]+$') { throw "Invalid base64 source part: $($part.Name)" }
            [void]$encoded.Append($data)
          }
          $bytes = [System.Convert]::FromBase64String($encoded.ToString())
          if ($bytes.Length -ne 5070732) { throw "AAH source length mismatch: $($bytes.Length)" }
          New-Item -ItemType Directory -Force -Path 'ci-artifacts', 'ci-source' | Out-Null
          $zipPath = Join-Path (Resolve-Path 'ci-artifacts').Path 'aah-source.zip'
          [System.IO.File]::WriteAllBytes($zipPath, $bytes)
          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $zipPath).Hash.ToLowerInvariant()
          if ($sha -ne 'c3cd0286e81f43b6b427081cd3313fe08153a86baba032da3c2d8b2b3382571f') { throw "AAH source SHA256 mismatch: $sha" }
          Expand-Archive -LiteralPath $zipPath -DestinationPath 'ci-source' -Force
          if (-not (Test-Path 'ci-source/AAH/AccountingAutomationHub.sln')) { throw 'AAH source solution is missing after extraction' }
          Write-Host "AAH CL017 R14 source verified, extracted, and ready to compile."

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: false

      - name: Windows SDK information
        shell: pwsh
        run: dotnet --info

      - name: Restore the full Windows solution
        shell: pwsh
        run: |
          dotnet restore 'ci-source/AAH/AccountingAutomationHub.sln' --verbosity minimal
          if ($LASTEXITCODE -ne 0) { throw "Solution restore failed: $LASTEXITCODE" }

      - name: Compile all five solution projects
        shell: pwsh
        run: |
          dotnet build 'ci-source/AAH/AccountingAutomationHub.sln' --configuration Release --no-restore --verbosity normal -p:ContinuousIntegrationBuild=true -bl:ci-artifacts/aah-windows-compile.binlog
          if ($LASTEXITCODE -ne 0) { throw "Windows compilation failed: $LASTEXITCODE" }

      - name: Publish Windows Desktop to isolated CI folder
        shell: pwsh
        run: |
          dotnet publish 'ci-source/AAH/src/AccountingAutomationHub.Desktop/AccountingAutomationHub.Desktop.csproj' --configuration Release --runtime win-x64 --self-contained false --output ci-artifacts/published-app --verbosity minimal
          if ($LASTEXITCODE -ne 0) { throw "Desktop publish failed: $LASTEXITCODE" }
          if (-not (Test-Path 'ci-artifacts/published-app/AccountingAutomationHub.exe')) { throw 'Desktop executable missing from publish' }

      - name: Upload Windows compilation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aah-windows-build-diagnostics
          path: ci-artifacts/*.binlog
          retention-days: 14
          if-no-files-found: warn