name: AAH Windows Compile

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aah-windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-compile:
    name: .NET 10 Desktop / All Test Project Builds
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out current AAH source
        uses: actions/checkout@v4

      - name: Require committed AAH source
        shell: pwsh
        run: |
          if (-not (Test-Path 'AAH/AccountingAutomationHub.sln')) {
            throw 'AAH Windows source missing: AAH/AccountingAutomationHub.sln'
          }

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: false

      - name: Display .NET and source revision
        shell: pwsh
        run: |
          dotnet --info
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore Windows solution
        shell: pwsh
        run: |
          dotnet restore 'AAH/AccountingAutomationHub.sln' --verbosity minimal
          if ($LASTEXITCODE -ne 0) { throw "Windows solution restore failed (exit $LASTEXITCODE)" }

      - name: Compile complete Windows solution
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'ci-artifacts' | Out-Null
          dotnet build 'AAH/AccountingAutomationHub.sln' --configuration Release --no-restore --verbosity normal -p:ContinuousIntegrationBuild=true -bl:ci-artifacts/AAH-Windows-Solution.binlog
          if ($LASTEXITCODE -ne 0) { throw "Windows solution compilation failed (exit $LASTEXITCODE)" }

      - name: Compile seven independent .NET regression projects
        shell: pwsh
        run: |
          $projects = @(
            'AAH.BankXmlValidator.Tests',
            'AAH.CacheLifecycle.Tests',
            'AAH.FeatureAudit.Tests',
            'AAH.StockIdentity.Tests',
            'AAH.StockMapping.Tests',
            'AAH.StockProjection.Tests',
            'AAH.TallyInventory.Tests'
          )
          foreach ($project in $projects) {
            $path = "AAH/Tests/$project/$project.csproj"
            if (-not (Test-Path $path)) { throw "Missing mandatory test project: $path" }
            Write-Host "BUILDING $project"
            dotnet build $path --configuration Release --verbosity minimal -p:ContinuousIntegrationBuild=true -p:CopyLocalLockFileAssemblies=true "-bl:ci-artifacts/$project.binlog"
            if ($LASTEXITCODE -ne 0) { throw "Failed .NET regression project: $project" }
          }

      - name: Publish Windows WPF Desktop into isolated CI folder
        shell: pwsh
        run: |
          dotnet publish 'AAH/src/AccountingAutomationHub.Desktop/AccountingAutomationHub.Desktop.csproj' --configuration Release --runtime win-x64 --self-contained false --output ci-artifacts/published-app --verbosity minimal
          if ($LASTEXITCODE -ne 0) { throw "Windows Desktop publish failed (exit $LASTEXITCODE)" }
          if (-not (Test-Path 'ci-artifacts/published-app/AccountingAutomationHub.exe')) { throw 'Windows Desktop executable missing from publish.' }

      - name: Upload Windows compilation diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AAH-Windows-Compile-Diagnostics
          path: ci-artifacts/*.binlog
          if-no-files-found: warn
          retention-days: 14
