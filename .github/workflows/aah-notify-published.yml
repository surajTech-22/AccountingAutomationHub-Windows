name: Notify AAH Desktop On Manually Published Release
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-signal:
    if: ${{ !github.event.release.draft && !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify stable AAH release assets and send wakeup
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --json assets,isDraft,isPrerelease,tagName > "$RUNNER_TEMP/aah-release.json"
          python3 - "$RUNNER_TEMP/aah-release.json" "$RELEASE_TAG" <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1]))
          required={'AAH_Update.exe','AAH_Update.exe.sha256','AAH_App-win-x64.zip','AAH_AutoUpdate.json'}
          assets={a['name'] for a in j['assets']}
          assert j['tagName']==sys.argv[2] and not j['isDraft'] and not j['isPrerelease']
          assert required.issubset(assets), 'Incomplete AAH update release; no broadcast.'
          PY
          # ntfy is ONLY a public wakeup; installed clients re-verify the
          # real repository release, protocol and SHA256 before installation.
          curl --fail --silent --show-error --max-time 30 -X POST \
            -H "Content-Type: text/plain" --data-binary "$RELEASE_TAG" \
            "https://ntfy.sh/aah-surajtech22-windows-release-signal-v1"
